<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="FitTrack, a fitness tracker built for one person">
  <title>FitTrack</title>
  <defs>
    <linearGradient id="cal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9500"/><stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <linearGradient id="pro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>
    <linearGradient id="h2o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/><stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9500"/><stop offset="55%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FF9500" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .ring { fill: none; stroke-linecap: round; transform-origin: center; }
    /* Each ring draws itself once, then holds. stroke-dasharray is set per
       ring to its own circumference so the dash maths stays local. */
    .r1 { stroke-dasharray: 396; animation: draw1 3.2s cubic-bezier(.22,1,.36,1) infinite; }
    .r2 { stroke-dasharray: 314; animation: draw2 3.2s cubic-bezier(.22,1,.36,1) infinite; }
    .r3 { stroke-dasharray: 232; animation: draw3 3.2s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes draw1 { 0% { stroke-dashoffset: 396 } 45%,85% { stroke-dashoffset: 79 } 100% { stroke-dashoffset: 396 } }
    @keyframes draw2 { 0% { stroke-dashoffset: 314 } 50%,85% { stroke-dashoffset: 47 } 100% { stroke-dashoffset: 314 } }
    @keyframes draw3 { 0% { stroke-dashoffset: 232 } 55%,85% { stroke-dashoffset: 23 } 100% { stroke-dashoffset: 232 } }

    .word { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .sub  { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    .mono { font-family: 'SF Mono', Consolas, 'Roboto Mono', monospace; font-weight: 600; }

    .fadein { opacity: 0; animation: fade 3.2s ease-out infinite; }
    .d1 { animation-delay: .25s } .d2 { animation-delay: .45s } .d3 { animation-delay: .65s }
    .d4 { animation-delay: .85s } .d5 { animation-delay: 1.0s } .d6 { animation-delay: 1.15s }
    @keyframes fade { 0% { opacity: 0; transform: translateY(6px) } 22%,88% { opacity: 1; transform: translateY(0) } 100% { opacity: 0; transform: translateY(6px) } }

    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 190px 160px; }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .75 } }

    /* Anyone who has asked their OS to stop moving things gets a still frame. */
    @media (prefers-reduced-motion: reduce) {
      .r1 { stroke-dashoffset: 79 } .r2 { stroke-dashoffset: 47 } .r3 { stroke-dashoffset: 23 }
      .r1,.r2,.r3,.fadein,.pulse { animation: none }
      .fadein { opacity: 1 }
    }
  </style>

  <rect width="1200" height="320" fill="#000000"/>
  <circle cx="190" cy="160" r="150" fill="url(#glow)" class="pulse"/>

  <g transform="translate(190,160) rotate(-90) translate(-190,-160)">
    <circle class="ring" cx="190" cy="160" r="63" stroke="#1C1C1E" stroke-width="13"/>
    <circle class="ring" cx="190" cy="160" r="50" stroke="#1C1C1E" stroke-width="13"/>
    <circle class="ring" cx="190" cy="160" r="37" stroke="#1C1C1E" stroke-width="13"/>
    <circle class="ring r1" cx="190" cy="160" r="63" stroke="url(#cal)" stroke-width="13"/>
    <circle class="ring r2" cx="190" cy="160" r="50" stroke="url(#pro)" stroke-width="13"/>
    <circle class="ring r3" cx="190" cy="160" r="37" stroke="url(#h2o)" stroke-width="13"/>
  </g>

  <text x="360" y="128" class="word fadein d1" font-size="72" fill="#FFFFFF">Fit<tspan fill="url(#fade)">Track</tspan></text>
  <text x="364" y="172" class="sub fadein d2" font-size="21" fill="#AEAEB2">A fitness tracker built for one body, then shared with friends.</text>

  <g class="mono" font-size="13" fill="#8E8E93">
    <g class="fadein d3"><rect x="364" y="204" width="132" height="30" rx="8" fill="#0E0E0F" stroke="#2C2C2E"/><text x="378" y="224" fill="#FF9500">vanilla JS</text></g>
    <g class="fadein d4"><rect x="506" y="204" width="122" height="30" rx="8" fill="#0E0E0F" stroke="#2C2C2E"/><text x="520" y="224" fill="#30D158">zero deps</text></g>
    <g class="fadein d5"><rect x="638" y="204" width="150" height="30" rx="8" fill="#0E0E0F" stroke="#2C2C2E"/><text x="652" y="224" fill="#0A84FF">offline PWA</text></g>
    <g class="fadein d6"><rect x="798" y="204" width="164" height="30" rx="8" fill="#0E0E0F" stroke="#2C2C2E"/><text x="812" y="224" fill="#BF5AF2">web push</text></g>
  </g>

  <text x="364" y="268" class="sub fadein d6" font-size="13" fill="#5A5A5E">One HTML file. No build step. No account. No subscription.</text>
</svg>
