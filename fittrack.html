<script>
/* Resolves and paints the theme before the first frame, straight from
   localStorage, so there is no dark-to-light flash on launch. The full
   applyTheme() below (in the app script) re-runs the same resolution once
   S.cfg exists, this copy only has to get the attribute on <html> right
   before anything paints. The two hex values here must stay equal to
   --black in each [data-theme] block below: this paints the status bar
   cutout and the home indicator before CSS is even parsed. */
(function(){
  try{
    var cfg=JSON.parse(localStorage.getItem('ft_settings')||'null');
    var pref=(cfg&&cfg.theme)||'system';
    var light=pref==='light'||(pref==='system'&&matchMedia('(prefers-color-scheme: light)').matches);
    var theme=light?'light':'dark';
    document.documentElement.setAttribute('data-theme',theme);
    var mc=document.querySelector('meta[name="theme-color"]');
    if(mc)mc.setAttribute('content',light?'#F2F2F7':'#000000');
    var cs=document.querySelector('meta[name="color-scheme"]');
    if(cs)cs.setAttribute('content',theme);
  }catch(e){}
})();
</script>

<style>
:root{
  --black:#000000;--s1:#111111;--s2:#1C1C1E;--s3:#2C2C2E;--s4:#3A3A3C;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --orange:#FF9500;--orange-dim:rgba(255,149,0,0.18);--orange-wash:rgba(255,149,0,0.08);--orange-border:rgba(255,149,0,0.25);
  --coral:#FF6B6B;--coral-dim:rgba(255,107,107,0.18);--coral-border:rgba(255,107,107,0.25);
  --blue:#0A84FF;--blue-light:#4FC3F7;--blue-dim:rgba(79,195,247,0.18);--blue-wash:rgba(10,132,255,0.07);--blue-border:rgba(79,195,247,0.25);
  --green:#30D158;--green-dim:rgba(48,209,88,0.18);--green-wash:rgba(48,209,88,0.06);--green-faint:rgba(48,209,88,0.03);--green-border:rgba(48,209,88,0.25);
  --purple:#BF5AF2;--purple-dim:rgba(191,90,242,0.18);--purple-border:rgba(191,90,242,0.25);
  --red:#FF453A;--red-dim:rgba(255,69,58,0.12);--yellow:#FFD60A;
  /* Measured against --black #000000: t2 9.7:1, t3 6.4:1, t4 3.4:1.
     t3 was #636366 (3.5:1) and t4 #3A3A3C (1.7:1), which put every secondary
     label and every input placeholder under the 4.5:1 floor. t4 is now only
     used for decoration, never for text that has to be read. */
  --t1:#FFFFFF;--t2:#AEAEB2;--t3:#8E8E93;--t4:#5A5A5E;
  --tabbar-bg:rgba(15,15,15,0.94);
  /* Every bright accent above is legible on black and fails 4.5:1 on white
     (--orange measures ~2.2:1, --green ~2.0:1). These -text tokens are the
     same accents wherever they carry running text or a border rather than a
     solid fill: dark mode leaves them equal to the accent (zero visual
     change), the [data-theme="light"] block below is where they actually
     get darker. Chips, dots, ring tracks and filled buttons keep using the
     plain accent, since a solid fill never needs to pass a text contrast
     check. */
  --orange-text:var(--orange);--green-text:var(--green);--purple-text:var(--purple);
  --coral-text:var(--coral);--blue-text:var(--blue);--blue-light-text:var(--blue-light);
  --red-text:var(--red);
  --spring:cubic-bezier(0.34,1.56,0.64,1);
  /* Data-bearing fills use ease-out-quint, never --spring. A spring overshoots
     its target by ~11%, so a ring or bar driven by a real number would render
     past that number before settling back. Fine on a button press, misleading
     on a value the user is meant to read. */
  --ease-data:cubic-bezier(0.22,1,0.36,1);
  --smooth:cubic-bezier(0.25,0.46,0.45,0.94);
  --r-sm:10px;--r-md:16px;--r-lg:20px;--r-xl:28px;
  --tab-h:64px;--safe-b:env(safe-area-inset-bottom,16px);--safe-t:env(safe-area-inset-top,0px);
}
/* Light appearance. Designed, not inverted: real surfaces (white cards on an
   off-white page, the same elevation direction dark mode uses, just toward
   grey instead of toward white), real borders, and every text token measured
   on its own worst-case surface the same way the dark comment above does.
   Measured live in Chrome (test/layout-probe.mjs) against --black #F2F2F7:
   t1 18.82:1, t2 8.18:1, t3 5.97:1, t4 2.71:1 (t4 stays decoration-only,
   same as dark). Accent -text overrides, same measurement: orange-text
   5.42:1, green-text 4.85:1, purple-text 5.24:1, coral-text 4.98:1,
   blue-text/blue-light-text 5.89:1, red-text 5.16:1. */
[data-theme="light"]{
  --black:#F2F2F7;--s1:#FFFFFF;--s2:#EDEDF2;--s3:#DFDFE6;--s4:#C7C7CC;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --t1:#000000;--t2:#48484A;--t3:#5C5C60;--t4:#949498;
  --tabbar-bg:rgba(255,255,255,0.85);
  --orange-text:#9C4D00;--green-text:#1C7A34;--purple-text:#8A3FC4;
  --coral-text:#C23131;--blue-text:#0B5FA5;--blue-light-text:#0B5FA5;
  --red-text:#C22A20;--orange-wash:rgba(156,77,0,0.08);--blue-wash:rgba(11,95,165,0.07);
  --green-wash:rgba(28,122,52,0.06);--green-faint:rgba(28,122,52,0.03);--red-dim:rgba(194,42,32,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
/* One switch for the whole app. Confetti, ring fills and screen slides all run
   off animation/transition, so cutting both to ~0 honours the OS setting
   without hunting down every keyframe. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important;}
}
html{height:100%;overflow:hidden;background:var(--black);}
body{height:100%;overflow:hidden;background:var(--black);color:var(--t1);font-family:-apple-system,'SF Pro Display','SF Pro Text','Roboto',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation;}
input,button,select,textarea{font-family:inherit;-webkit-tap-highlight-color:transparent;}
button{cursor:pointer;border:none;background:none;color:inherit;}
input{outline:none;border:none;background:none;color:inherit;}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
/* APP SHELL */
#app{width:100vw;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;}
#screen-container{flex:1;position:relative;overflow:hidden;}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(var(--tab-h) + var(--safe-b) + 20px);padding-top:var(--safe-t);will-change:transform;background:var(--black);transform:translateX(100%);}
/* Home is the only screen parked on-stage at first paint. Without this every
   .screen sits at translateX(0) and #s4 (Settings), last in the DOM, covers
   Home on load. go() overwrites these via inline cssText afterwards. */
#s0{transform:translateX(0);}
.screen::-webkit-scrollbar{display:none;}
/* TAB BAR */
#statusbar-fill{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--black);z-index:90;pointer-events:none;}
#tab-bar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--tabbar-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:6px;z-index:100;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;touch-action:manipulation;}
.tab-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:all 0.25s var(--spring);}
.tab-icon svg{width:22px;height:22px;stroke:var(--t3);transition:stroke 0.2s;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.tab-label{font-size:10px;font-weight:500;color:var(--t2);transition:color 0.2s;letter-spacing:0.2px;}
.tab-btn.active .tab-icon svg{stroke:var(--orange);}
.tab-btn.active .tab-label{color:var(--orange-text);}
.tab-btn.active .tab-icon{transform:scale(1.1) translateY(-1px);}
/* SCREEN HEADERS */
.screen-header{padding:18px 20px 10px;display:flex;align-items:flex-start;justify-content:space-between;}
.header-title{font-size:28px;font-weight:700;letter-spacing:-0.5px;line-height:1.15;}
.header-sub{font-size:13px;color:var(--t2);margin-top:3px;}
.hdr-btn{width:36px;height:36px;background:var(--s2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;border:1px solid var(--border);}
.hdr-btn svg{width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
/* CARDS */
.card{background:var(--s1);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;}
.section-label{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:0.8px;margin:0 16px 8px;padding:0 4px;}
/* ACTIVITY RINGS */
.rings-wrap{margin:0 16px 12px;background:var(--s1);border-radius:var(--r-lg);border:1px solid var(--border);padding:18px 4px 14px;display:flex;align-items:flex-start;justify-content:space-around;}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;}
.ring-svg-wrap{position:relative;width:86px;height:86px;}
.ring-svg-wrap svg{width:86px;height:86px;transform:rotate(-90deg);}
.ring-bg{stroke:var(--s3);fill:none;}
.ring-track{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.3s var(--ease-data);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-val{font-size:16px;font-weight:800;line-height:1;letter-spacing:-0.5px;}
.ring-unit{font-size:9px;color:var(--t2);font-weight:500;margin-top:2px;}
.ring-name{font-size:11px;font-weight:600;color:var(--t2);text-align:center;}
/* CHECK-IN CARDS */
.checkin-row{margin:0 16px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.ci-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all 0.3s var(--spring);position:relative;overflow:hidden;}
.ci-card.done{background:var(--green-wash);border-color:var(--green-border);}
.ci-icon{font-size:20px;line-height:1;}
.ci-lbl{font-size:10px;font-weight:600;color:var(--t2);text-align:center;letter-spacing:0.2px;}
.ci-status{font-size:9px;font-weight:600;color:var(--t3);}
.ci-card.done .ci-status{color:var(--green-text);}
.ci-check{position:absolute;top:6px;right:6px;width:16px;height:16px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0);transition:all 0.4s var(--spring);}
.ci-card.done .ci-check{opacity:1;transform:scale(1);}
.ci-check svg{width:9px;height:9px;stroke:#000;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
/* STEPS CARD */
.steps-card{margin:0 16px 12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;}
.steps-num{font-size:32px;font-weight:800;color:var(--green-text);letter-spacing:-1px;line-height:1;}
.prog-track{height:6px;background:var(--s3);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width 1s var(--ease-data);}
/* QUICK ACTIONS */
.qa-grid{margin:0 16px 12px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
.qa-btn{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform 0.15s var(--spring);}
.qa-btn:active{transform:scale(0.92);}
/* First run only. A full cover rather than a screen, so it cannot be swiped
   away or tabbed past before there is a profile to render anything from. */
#onboard{position:fixed;inset:0;z-index:400;background:var(--black);overflow-y:auto;overflow-x:hidden;display:none;padding:calc(var(--safe-t) + 28px) 22px calc(var(--safe-b) + 28px);}
#onboard.show{display:block;}
.ob-progress{margin-bottom:24px;}
.ob-progress-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--t3);}
.ob-progress-name{color:var(--orange-text);}
.ob-progress-track{height:5px;overflow:hidden;border-radius:3px;background:var(--s3);}
.ob-progress-fill{height:100%;border-radius:inherit;background:var(--orange);transform:scaleX(var(--ob-progress-to));transform-origin:left center;animation:ob-progress-in .24s var(--ease-data) both;}
.ob-stage.ob-forward{--ob-shift:18px;}
.ob-stage.ob-back{--ob-shift:-18px;}
.ob-enter-item{animation:ob-step-in .22s var(--smooth) both;animation-delay:var(--ob-delay,0ms);}
@keyframes ob-progress-in{from{transform:scaleX(var(--ob-progress-from))}to{transform:scaleX(var(--ob-progress-to))}}
@keyframes ob-step-in{from{opacity:0;transform:translateX(var(--ob-shift,0))}to{opacity:1;transform:translateX(0)}}
@keyframes ob-error-in{0%{opacity:0;transform:translateX(8px)}65%{opacity:1;transform:translateX(-2px)}100%{opacity:1;transform:translateX(0)}}
.ob-h{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:8px;}
.ob-p{font-size:14px;color:var(--t2);line-height:1.55;margin-bottom:22px;}
.ob-opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.ob-opt{flex:1;min-width:78px;min-height:48px;padding:12px 10px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-md);font-size:14px;font-weight:600;color:var(--t2);text-align:center;touch-action:manipulation;transition:transform .14s var(--spring),background-color .18s var(--smooth),border-color .18s var(--smooth),color .18s var(--smooth);}
.ob-opt.on{background:var(--orange-dim);border-color:var(--orange-border);color:var(--orange-text);transform:scale(1.015);}
.ob-tog{width:100%;min-height:56px;display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:10px;text-align:left;touch-action:manipulation;transition:transform .14s var(--spring),background-color .18s var(--smooth),border-color .18s var(--smooth);}
.ob-tog.on{background:var(--orange-dim);border-color:var(--orange-border);}
.ob-opt:active,.ob-tog:active,.ob-btn:active{transform:scale(.97);}
.ob-opt:focus-visible,.ob-tog:focus-visible,.ob-btn:focus-visible{outline:2px solid var(--orange-text);outline-offset:2px;}
.ob-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#000;margin-top:1px;transition:transform .18s var(--spring),background-color .18s var(--smooth),border-color .18s var(--smooth);}

/* Published numbers and guesses must be distinguishable at a glance. He asked

.conf-pub{background:var(--green-dim);color:var(--green-text);}
.conf-der{background:var(--orange-dim);color:var(--orange-text);}
.conf-est{background:var(--s3);color:var(--t3);}
.sri-brand{font-size:11px;color:var(--t3);}
.supp-card{margin:0 16px 12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.supp-row{width:100%;min-height:64px;padding:11px 14px;display:flex;align-items:center;gap:12px;text-align:left;transition:transform 0.15s var(--spring),background 0.15s var(--smooth);}
.supp-row+.supp-row{border-top:1px solid var(--border);}
.supp-row:active{background:var(--s2);transform:scale(0.985);}
.supp-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.supp-icon.protein{background:var(--coral-dim);color:var(--coral-text);}
.supp-icon.creatine{background:var(--green-dim);color:var(--green-text);}
.supp-copy{flex:1;min-width:0;}
.supp-title{font-size:14px;font-weight:700;color:var(--t1);}
.supp-status{font-size:11px;color:var(--t2);margin-top:2px;}
.supp-action{width:72px;height:44px;border-radius:12px;border:1px solid var(--border2);background:var(--s2);color:var(--t2);display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;flex-shrink:0;}
.supp-action.on{background:var(--s3);color:var(--t1);}
.supp-action svg{width:12px;height:12px;}
.qa-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.qa-icon svg{width:17px;height:17px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.qa-lbl{font-size:10px;font-weight:500;color:var(--t2);text-align:center;}
/* WEIGHT HOME CARD */
.wt-card{margin:0 16px 12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;align-items:center;justify-content:space-between;}
.wt-big{font-size:30px;font-weight:800;color:var(--purple-text);letter-spacing:-0.8px;line-height:1;}
.wt-delta-down{font-size:12px;font-weight:600;color:var(--green-text);}
.wt-delta-up{font-size:12px;font-weight:600;color:var(--coral-text);}
.wt-delta-same{font-size:12px;font-weight:500;color:var(--t3);}
.wt-log-btn{background:var(--purple-dim);color:var(--purple-text);border:1px solid var(--purple-border);border-radius:20px;padding:9px 16px;font-size:13px;font-weight:700;transition:transform 0.15s var(--spring);}
.wt-log-btn:active{transform:scale(0.95);}
/* TODAY BADGE */
.today-badge{display:inline-flex;align-items:center;gap:5px;background:var(--orange-dim);border:1px solid var(--orange-border);border-radius:14px;padding:4px 12px 4px 8px;font-size:11px;font-weight:600;color:var(--orange-text);margin-top:7px;letter-spacing:0.2px;}
/* WORKOUT SCREEN */
.day-tabs{padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;min-height:44px;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--s1);color:var(--t2);font-size:12px;font-weight:600;transition:all 0.2s var(--smooth);line-height:1.15;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.day-tab-label{font-size:9px;opacity:.7;}
.day-tab.active{background:var(--blue);border-color:var(--blue-text);color:#fff;}
.workout-progress{margin:0 16px 12px;}
.workout-progress-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;}
.workout-progress-count{font-size:12px;font-weight:600;color:var(--t2);}
.workout-progress-pct{font-size:11px;color:var(--t3);margin-top:2px;}
.whole-session-btn{min-height:44px;margin:0;padding:0 12px;flex-shrink:0;background:var(--s2);color:var(--t2);border:1px solid var(--border);border-radius:12px;font-size:12px;font-weight:700;line-height:1.2;text-align:center;transition:transform 0.15s var(--spring),border-color 0.2s var(--smooth);}
.whole-session-btn:active{transform:scale(0.97);border-color:var(--border2);}
.ex-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;}
.ex-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:border-color 0.3s;}
.ex-card.completed{border-color:var(--green-border);background:var(--green-faint);}
.ex-hdr{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;touch-action:manipulation;}
.ex-icon{width:42px;height:42px;background:var(--blue-dim);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.3s;}
.ex-card.completed .ex-icon{background:var(--green-dim);}
.ex-icon svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke 0.3s;}
.ex-card.completed .ex-icon svg{stroke:var(--green);}
.ex-info{flex:1;min-width:0;}
.ex-name{font-size:15px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ex-name span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ex-subline{display:flex;align-items:flex-start;flex-direction:column;gap:4px;min-width:0;margin-top:2px;}
.ex-meta{font-size:12px;color:var(--t2);max-width:100%;overflow-wrap:anywhere;}
.ex-muscle{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:9px;font-weight:700;background:var(--blue-dim);color:var(--blue-light-text);padding:3px 8px;border-radius:8px;white-space:nowrap;letter-spacing:0.3px;text-transform:uppercase;}
.ex-done-badge{width:24px;height:24px;background:var(--green);border-radius:50%;display:none;align-items:center;justify-content:center;opacity:0;transform:scale(0);flex-shrink:0;}
.ex-card.completed .ex-done-badge{display:flex;opacity:1;transform:scale(1);animation:ex-done-in 0.4s var(--spring);}
@keyframes ex-done-in{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.ex-done-badge svg{width:12px;height:12px;stroke:#000;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.ex-chevron{width:18px;height:18px;flex-shrink:0;transition:transform 0.3s var(--smooth);}
.ex-card.completed .ex-chevron{display:none;}
.ex-chevron svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ex-card.open .ex-chevron{transform:rotate(180deg);}
.ex-body{max-height:0;overflow:hidden;transition:max-height 0.45s var(--smooth);}
.ex-card.open .ex-body{max-height:1600px;}
.ex-body-inner{padding:0 16px 16px;border-top:1px solid var(--border);padding-top:14px;}
.set-hdr,.set-row{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;}
.set-hdr{margin-bottom:8px;}
.set-hdr-lbl{font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:0.6px;text-align:center;}
.set-row{margin-bottom:8px;align-items:center;transition:opacity 0.3s;}
.set-row.done{opacity:0.45;}
.set-num{width:26px;height:26px;background:var(--s3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--t2);margin:auto;transition:all 0.3s var(--spring);}
.set-row.done .set-num{background:var(--green);color:#000;}
.set-inp-wrap{min-width:0;background:var(--s2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;overflow:visible;}
.set-adj{width:32px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:17px;font-weight:300;flex-shrink:0;position:relative;z-index:1;}
.set-adj::before{content:"";position:absolute;inset:0 -6px;}
.set-adj:active{background:var(--s3);}
.set-inp{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--t1);background:none;height:44px;min-width:0;}
.set-chk{width:34px;height:34px;background:var(--s3);border-radius:9px;display:flex;align-items:center;justify-content:center;transition:all 0.3s var(--spring);margin:auto;}
.set-chk svg{width:15px;height:15px;stroke:var(--t3);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.set-chk.on{background:var(--green);}
.set-chk.on svg{stroke:#000;}
.rest-bar{margin-top:12px;background:var(--s2);border-radius:12px;padding:11px 14px;display:none;align-items:center;justify-content:space-between;}
.rest-bar.show{display:flex;}
.rest-lbl{font-size:12px;color:var(--t2);font-weight:500;}
.rest-cd{font-size:20px;font-weight:800;color:var(--orange-text);letter-spacing:-0.5px;}
.rest-skip{font-size:12px;font-weight:700;color:var(--blue-text);background:var(--blue-dim);padding:6px 12px;border-radius:8px;}
.form-cues{margin-top:12px;background:var(--blue-wash);border-radius:12px;padding:12px;}
.cue-title{font-size:9px;font-weight:700;color:var(--blue-light-text);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
.cue-item{display:flex;gap:7px;margin-bottom:6px;font-size:12px;color:var(--t2);line-height:1.45;align-items:flex-start;}
.cue-dot{width:5px;height:5px;border-radius:50%;background:var(--blue-light);flex-shrink:0;margin-top:5px;}
.ex-where{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--blue-border);font-size:12px;color:var(--t2);line-height:1.45;overflow-wrap:anywhere;}
.ex-where .cue-title{margin-bottom:4px;}
.ex-complete-btn{width:100%;margin-top:14px;padding:13px;background:var(--blue);border-radius:var(--r-md);font-size:15px;font-weight:700;color:#fff;text-align:center;transition:all 0.2s var(--spring);}
.ex-complete-btn:active{transform:scale(0.97);}
.ex-complete-btn.done{background:var(--green);color:#000;}
.warmup-banner{margin:0 16px 12px;background:var(--orange-wash);border:1px solid var(--orange-border);border-radius:var(--r-md);padding:12px 14px;}
.warmup-title{font-size:10px;font-weight:700;color:var(--orange-text);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:5px;}
.warmup-txt{font-size:12px;color:var(--t2);line-height:1.55;}
.finish-btn{margin:14px 16px 0;padding:16px;background:linear-gradient(135deg,#FF9500,#FF6B35);border-radius:var(--r-lg);font-size:16px;font-weight:800;color:#fff;text-align:center;transition:transform 0.15s var(--spring);letter-spacing:0.2px;}
.finish-btn:active{transform:scale(0.97);}
.finish-btn.done{background:var(--green);color:#000;}
/* NUTRITION SCREEN */
.macro-card{margin:4px 16px 12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;}
.macro-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;}
.macro-target-head{position:relative;margin:2px 0 10px;padding-right:30px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;}
.floor-warning{position:relative;margin-top:12px;padding:10px 34px 10px 11px;background:var(--orange-dim);border:1px solid var(--orange-border);border-radius:var(--r-sm);}
.floor-warning-title{font-size:11px;font-weight:700;color:var(--orange-text);}
.floor-warning-copy{font-size:11px;color:var(--t2);line-height:1.45;margin-top:2px;}
.macro-cal-big{font-size:36px;font-weight:800;color:var(--orange-text);letter-spacing:-1px;line-height:1;}
.macro-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.macro-bar-lbl{font-size:12px;font-weight:500;color:var(--t2);width:54px;}
.macro-bar-track{flex:1;height:6px;background:var(--s3);border-radius:3px;overflow:hidden;}
.macro-bar-fill{height:100%;border-radius:3px;transition:width 0.9s var(--ease-data);}
.macro-bar-val{font-size:11px;font-weight:600;color:var(--t2);width:60px;text-align:right;}
.food-search-wrap{margin:0 16px 12px;position:relative;}
.food-search-input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 44px 13px 44px;font-size:15px;color:var(--t1);transition:border-color 0.2s;}
.food-search-input::placeholder{color:var(--t3);}
.food-search-input:focus{border-color:var(--border2);}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;pointer-events:none;}
.search-ico svg{width:18px;height:18px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.search-clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;background:var(--s3);border-radius:50%;display:none;align-items:center;justify-content:center;}
.search-clr.show{display:flex;}
.search-clr svg{width:10px;height:10px;stroke:var(--t2);fill:none;stroke-width:2.5;stroke-linecap:round;}
.search-results{margin:0 16px 12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;display:none;}
.search-results.show{display:block;}
.sri{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;transition:background 0.1s;}
.sri:last-child{border-bottom:none;}
.sri:active{background:var(--s2);}
.sri-name{font-size:14px;font-weight:500;color:var(--t1);flex:1;}
.sri-macro{font-size:11px;color:var(--t2);margin-top:2px;}
.sri-history{color:var(--green-text);font-weight:600;}
.sri-add{width:28px;height:28px;background:var(--orange-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sri-add svg{width:14px;height:14px;stroke:var(--orange-text);fill:none;stroke-width:2.5;stroke-linecap:round;}
.search-manual-btn{padding:12px 16px;display:flex;align-items:center;gap:10px;color:var(--blue-text);font-size:14px;font-weight:600;border-top:1px solid var(--border);width:100%;}
.search-manual-btn svg{width:16px;height:16px;stroke:var(--blue-text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.meal-sec{margin:0 16px 10px;}
.meal-sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px;}
.meal-sec-name{font-size:13px;font-weight:600;color:var(--t2);}
.meal-sec-cals{font-size:12px;color:var(--t3);font-weight:500;}
.meal-item{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.meal-name{font-size:14px;font-weight:500;color:var(--t1);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meal-macro{font-size:10px;color:var(--t2);margin-top:2px;}
.meal-cal{font-size:14px;font-weight:700;color:var(--orange-text);}
.meal-del{width:28px;height:28px;background:var(--red-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.meal-del svg{width:12px;height:12px;stroke:var(--red-text);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.water-card{margin:0 16px 12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;}
.water-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px;}
.water-val{font-size:28px;font-weight:800;color:var(--blue-light-text);letter-spacing:-0.5px;line-height:1;}
.water-btns{display:flex;gap:7px;margin-top:12px;}
.water-btn{flex:1;background:var(--blue-dim);color:var(--blue-light-text);border:1px solid var(--blue-border);border-radius:10px;padding:10px 4px;font-size:11px;font-weight:700;text-align:center;transition:transform 0.15s var(--spring);}
.water-btn:active{transform:scale(0.94);}
/* PROGRESS SCREEN */
.wt-chart-card{margin:4px 16px 12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;}
.chart-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.chart-current{font-size:30px;font-weight:800;color:var(--purple-text);letter-spacing:-0.8px;}
.range-tabs{display:flex;gap:6px;}
.range-tab{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:none;color:var(--t3);font-size:11px;font-weight:600;transition:all 0.2s var(--smooth);}
.range-tab.active{background:var(--purple);border-color:var(--purple-text);color:#fff;}
.chart-wrap{height:160px;position:relative;}
.streak-row{margin:0 16px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.streak-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 10px;text-align:center;}
.streak-num{font-size:28px;font-weight:800;line-height:1;letter-spacing:-0.5px;}
.streak-lbl{font-size:9px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-top:5px;}
.cal-card{margin:0 16px 12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-month{font-size:16px;font-weight:700;}
.cal-nav{display:flex;gap:4px;}
.cal-nav-btn{width:30px;height:30px;background:var(--s2);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn svg{width:14px;height:14px;stroke:var(--t2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cal-days-hdr{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
.cal-day-lbl{text-align:center;font-size:9px;font-weight:600;color:var(--t3);padding:4px 0;text-transform:uppercase;letter-spacing:0.3px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px;font-size:12px;font-weight:500;color:var(--t2);position:relative;cursor:pointer;}
.cal-cell.today{background:var(--s2);color:var(--t1);font-weight:700;}
.cal-cell.empty{opacity:0;pointer-events:none;}
.cal-cell-dot{width:4px;height:4px;border-radius:50%;}
.bstats-card{margin:0 16px 12px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.stat-box{background:var(--s2);border-radius:var(--r-sm);padding:12px 8px;text-align:center;}
.stat-box-lbl{font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
.stat-box-val{font-size:20px;font-weight:800;letter-spacing:-0.3px;line-height:1;}
.stat-box-unit{font-size:10px;color:var(--t2);font-weight:500;margin-top:1px;}
.dose-card-head{padding-right:34px;}
.dose-med{font-size:18px;font-weight:700;color:var(--t1);}
.dose-state{margin-top:12px;padding:12px;background:var(--s2);border-radius:var(--r-md);}
.dose-state-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;}
.dose-state-value{font-size:22px;font-weight:700;color:var(--green-text);margin-top:3px;}
.dose-state-copy{font-size:12px;color:var(--t2);line-height:1.45;margin-top:3px;}
.dose-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.dose-stat{background:var(--s2);border-radius:var(--r-sm);padding:10px;}
.dose-stat-label{font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.45px;}
.dose-stat-value{font-size:16px;font-weight:700;color:var(--t1);margin-top:3px;}
.dose-history{margin-top:12px;border-top:1px solid var(--border);}
.dose-history-row{min-height:44px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);font-size:12px;}
.dose-history-row:last-child{border-bottom:none;}
.dose-history-date{flex:1;color:var(--t2);}
.dose-history-mg{font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;}
.dose-status{min-width:64px;text-align:center;border-radius:8px;padding:4px 7px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.35px;}
.dose-status.taken{background:var(--green-dim);color:var(--green-text);}
.dose-status.scheduled{background:var(--blue-dim);color:var(--blue-light-text);}
.dose-edit-btn{width:100%;min-height:44px;margin-top:12px;border-radius:var(--r-md);background:var(--s2);border:1px solid var(--border);color:var(--t2);font-size:13px;font-weight:700;}
.dose-edit-row{display:grid;grid-template-columns:minmax(0,1fr) 88px 44px;gap:8px;align-items:end;margin-bottom:8px;}
.dose-edit-row .inp-grp{margin-bottom:0;}
.dose-remove{width:44px;height:44px;border-radius:var(--r-md);background:var(--red-dim);color:var(--red-text);display:flex;align-items:center;justify-content:center;}

function svgIcon(key,size=22,stroke='currentColor'){

  return I[key].replace('<svg','<svg width="'+size+'" height="'+size+'" stroke="'+stroke+'" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"');
}
const HELP_TOPICS={
  calorieFloor:{title:'Calorie floor',body:[
    'On a GLP-1, appetite can fall far enough that eating too little is the bigger risk.',
    '1,600 kcal is the hard floor for this plan, based on your current body and energy needs.',

  rampIn:{title:'Ramp-in training',body:[

};
function helpBtn(topicKey){
  const topic=HELP_TOPICS[topicKey];
  return topic?`<button type="button" class="help-btn" aria-label="More about ${esc(topic.title)}" onclick="openHelp('${topicKey}')">${svgIcon('info',14,'var(--t2)')}</button>`:'';
}
/* ── WORKOUT DATA ──────────────────────────────── */
/* The program lives in data/workout-program.json, fetched at startup. It used
   to be four days of dumbbell work hardcoded here, which assumed a lifter who
   trains on fixed weekdays and is comfortable with free weights. He is neither:
   he trains on any three days he feels like, and he has not been in a gym in
   three months.

   Nothing is inlined as a fallback on purpose. This page is itself served over
   the network, and the service worker caches both with the same network-first
   rule, so any situation that can load the app can load the program. A second
   copy here would only be a second thing to keep in sync. */
const DEFAULT_WORKOUT={version:0,days:[]};
const WARMUP='5 min incline walk, then one easy set of 10 on the first machine before your working sets. That set is not training, it is telling the joint what is about to happen.';

/* Weeks 1 and 2 run reduced sets. He is detrained, and the thing most likely to
   end this program is not a bad session, it is being too sore on day two to go
   back. Ramp state is resolved at load rather than at render, so it settles
   once per app open instead of on every repaint. */
function programDay(){
  const start=S.cfg&&S.cfg.programStart;
  return start?Math.floor((new Date(S.today+'T12:00:00')-new Date(start+'T12:00:00'))/86400000):null;
}
function inRampIn(weeks){
  const days=programDay();
  if(days==null||!weeks)return false;
  return days>=0&&days<weeks*7;
}
function rampWeek(weeks){
  const days=programDay();
  if(days==null)return 1;
  return Math.min(weeks,Math.floor(days/7)+1);
}
/* The json speaks in the program vocabulary (machine, cue, swap, rpe). The
   screen speaks in the shape it already had. This is the only place the two
   meet, which is why the whole workout screen survived the program change. */
function mapProgram(prog){
  const weeks=(prog.rampIn&&prog.rampIn.weeks)||0;
  const ramp=inRampIn(weeks);
  return {version:prog.version||1,ramp,rampWeeks:weeks,rampWeek:ramp?rampWeek(weeks):0,
    rampRule:(prog.rampIn&&prog.rampIn.rule)||'',
    days:(prog.sessions||[]).map(sn=>({
      id:sn.id,name:sn.name||('Session '+String(sn.id).toUpperCase()),
      label:String(sn.focus||'').split(' ')[0].replace(/-biased$/,''),
      sub:sn.focus||'',warmup:WARMUP,
      exercises:(sn.exercises||[]).map(e=>({
        id:e.id,name:e.name,muscle:e.machine||sn.focus||'',
        sets:ramp?(e.rampSets||e.sets):e.sets,reps:e.reps,
        weight:'',where:e.where||'',restSec:e.rest_s||90,
        cues:[e.cue,ramp?'Ramp-in weeks: stop with 4 or 5 reps left, not 2.':('Target RPE '+e.rpe+'. Stop with 2 or 3 reps left in the tank.'),
              e.swap?('If the machine is taken: '+e.swap):null].filter(Boolean),
      })),
    }))};
}
/* Anything he added himself is carried across a program update. Losing work he
   typed in is not an acceptable cost of shipping a new version. */
function carryCustom(oldW,newW){
  if(!oldW||!oldW.days)return newW;
  for(const od of oldW.days){
    const custom=(od.exercises||[]).filter(e=>String(e.id).startsWith('cx_'));
    if(!custom.length)continue;
    const target=newW.days.find(d=>d.id===od.id)||newW.days[0];
    if(target)target.exercises.push(...custom);
  }
  return newW;
}
async function loadProgram(){
  try{
    const r=await fetch('./data/workout-program.json');
    if(!r.ok)return;
    const prog=await r.json();
    if(!prog.sessions||!prog.sessions.length)return;
    S.workout=carryCustom(S.workout,mapProgram(prog));
    DB.saveWorkout(S.workout);
    S.workoutDay=suggestSession();
    if(S.screen===1)renderScreen(1);
  }catch(e){}
}
/* Sessions are interchangeable, so there is no correct next one, only a least
   recently done one. Opening on that beats opening on whatever he did last. */
function suggestSession(){
  const n=((S.workout&&S.workout.days)||[]).length;
  if(!n)return 0;
  for(const d of recentDates(21)){
    const l=DB.log(d);
    if(l&&l.workout&&l.workout.completed&&l.workout.dayIndex>=0)return (l.workout.dayIndex+1)%n;
  }
  return 0;
}
/* What he lifted last time on this exact movement, so the set rows open on a
   real number instead of a default he has to correct every single session. */
function lastWeightFor(exId){
  /* One parse, not 28. DB.log() re-reads and re-parses the entire ft_logs blob
     on every call, and this loop used to call it once per day scanned, on every
     unfilled set of every workout render. */
  const all=DB.allLogs();
  for(const d of recentDates(28)){
    if(d===S.today)continue;
    const l=all[d]||null;
    const sets=l&&l.workout&&l.workout.exercises&&l.workout.exercises[exId]&&l.workout.exercises[exId].sets;
    if(!sets)continue;
    for(let i=sets.length-1;i>=0;i--)if(sets[i]&&sets[i].weight)return sets[i].weight;
  }
  return null;
}
/* ── FOOD PRESETS ─────────────────────────────── */

const DB={
  get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}},
  /* Returns whether the write landed. A silent false here used to be a real
     data-loss path: iOS evicts localStorage and Android can hit quota, and
     either way the log simply did not save while the UI carried on as though
     it had. Warned once per session, because a failing store fails on every
     subsequent write and a toast per keystroke helps nobody. */
  set(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));return true;}
    catch(e){
      if(!DB._warned){
        DB._warned=true;
        try{toast('⚠️','Could not save','Storage is full or blocked. Export your data.');}catch(_){}
      }
      return false;
    }
  },
  _warned:false,
  /* A copy, never the shared constant. Handing out DEF_SETTINGS by reference
     means the first write to S.cfg silently edits the defaults for the rest of
     the session, so a half finished onboarding would leak into the fallback. */
  settings(){return this.get('ft_settings',null)||JSON.parse(JSON.stringify(DEF_SETTINGS));},
  saveSettings(s){this.set('ft_settings',s);},
  workout(){return this.get('ft_workout',DEFAULT_WORKOUT);},
  saveWorkout(w){this.set('ft_workout',w);},
  log(date){const all=this.get('ft_logs',{});return all[date]||null;},
  saveLog(date,log){const all=this.get('ft_logs',{});all[date]=log;this.set('ft_logs',all);queueState();},
  allLogs(){return this.get('ft_logs',{});},
  weights(){return this.get('ft_weights',[]);},

   Deltas convert too: lb/kg is a pure scale factor, so toDisp() is valid on a

   raw millilitres, the same way weight shows kg/lb rather than grams. */

   Sets all three at once. The individual toggles above remain reachable
   for a mixed setup (e.g. kg with fl oz), this just picks a sane default

  if(sys==='imperial'){S.cfg.units='lb';S.cfg.unitHeight='in';S.cfg.unitVol='floz';}
  else{S.cfg.units='kg';S.cfg.unitHeight='cm';S.cfg.unitVol='ml';}

/* -- THEME ------------------------------------------------------------------
   Dark, Light or System. The inline script at the top of <head> does this
   same resolution straight from localStorage before first paint, this copy
   is what runs once S.cfg exists: every later theme change, and the live
   prefers-color-scheme listener for "system", both go through here. */
function resolveTheme(){
  const pref=(S.cfg&&S.cfg.theme)||'system';
  if(pref==='light'||pref==='dark')return pref;
  return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';

function applyTheme(){
  const t=resolveTheme();

  const mc=document.querySelector('meta[name="theme-color"]');
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--black').trim();
  if(mc&&bg)mc.setAttribute('content',bg);
  const cs=document.querySelector('meta[name="color-scheme"]');
  if(cs)cs.setAttribute('content',t);

/* -- ARBITRARY-DATE LOGGING -------------------------------------------------

   set once in init() and never advances. That is why a day could not be
   backfilled after midnight. These helpers make any date writable. */

  const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);

}

/* Steps ingest by URL fragment: #steps=8432 or #steps=8432&date=2026-08-25
   so an iOS Shortcut or an Android HTTP-shortcut can push a day's count in
   one tap. Kept in the fragment, never the query string, so the value is
   never sent to the GitHub Pages server. */
function ingestFromHash(){
  const h=(location.hash||'').replace(/^#/,'');if(!h)return;
  const q=new URLSearchParams(h);
  const act=q.get('act');
  if(act){history.replaceState(null,'',location.pathname+location.search);handleAction(act);return;}
  const raw=q.get('steps');if(raw==null)return;
  const v=parseInt(raw,10);if(isNaN(v)||v<0||v>200000)return;
  const d=q.get('date')||S.today;
  if(!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(d))return;
  saveStepsFor(d,v);
  history.replaceState(null,'',location.pathname+location.search);
  toast('👟',`${v.toLocaleString()} steps imported`,shortDate(d));
  if(S.screen===0)renderScreen(0);
}

   data the owner has confirmed is stale and unused, bump SCHEMA and wipe. Any

function go(idx){
  if(idx===S.screen)return;
  const dir=idx>S.screen?1:-1;
  const old=document.getElementById('s'+S.screen);
  const nw=document.getElementById('s'+idx);
  renderScreen(idx);
  nw.style.cssText='transform:translateX('+dir*100+'%);transition:none;';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const t='transform 0.36s cubic-bezier(0.25,0.46,0.45,0.94)';
    old.style.cssText='transform:translateX('+(-dir*100)+'%);transition:'+t+';';

/* ── RING BUILDER ───────────────────────────── */
function ring(id,color,val,max,display,unit,textColor){
  const r=35,c=2*Math.PI*r,tc=textColor||color;
  /* The ring track keeps the bright accent, it is a fill, not text. The
     centred number and the label under it get the -text variant instead,
     since in light mode the plain accent fails 4.5:1 on a white card. */
  return `<div class="ring-item">
    <div class="ring-svg-wrap">
      <svg viewBox="0 0 86 86">
        <circle class="ring-bg" cx="43" cy="43" r="${r}" stroke-width="7"/>
        <circle class="ring-track" id="rt-${id}" cx="43" cy="43" r="${r}" stroke="${color}" stroke-width="7"
          stroke-dasharray="${c}" stroke-dashoffset="${c}"/>
      </svg>
      <div class="ring-center">
        <div class="ring-val" style="color:${tc}" id="rv-${id}">${display}</div>
        <div class="ring-unit">${unit}</div>
      </div>
    </div>
    <div class="ring-name" style="color:${tc};opacity:.8;">${id.toUpperCase()}</div>
  </div>`;
}
function animRing(id,val,max){
  const r=35,c=2*Math.PI*r,el=document.getElementById('rt-'+id);
  if(!el)return;
  const pct=Math.min(val/max,1);
  /* --ease-data, not --spring. This inline style overrides the .ring-track CSS
     rule, so fixing the stylesheet alone left the ring still overshooting. */
  setTimeout(()=>{el.style.transition='stroke-dashoffset 1.3s var(--ease-data)';el.style.strokeDashoffset=c*(1-pct);},60);
}
function countUp(id,target,dec=0){
  const el=document.getElementById('rv-'+id);if(!el)return;
  const dur=900,start=performance.now();
  const step=now=>{const p=Math.min((now-start)/dur,1),e=1-Math.pow(1-p,3),v=target*e;
    el.textContent=dec>0?v.toFixed(dec):Math.round(v).toLocaleString();
    if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

function exCard(ex,exLog){

    const s=exLog?.sets?.[i];
    const isDone=s?.done||false;
    const storedWeight=s?.weight??lastWeightFor(ex.id)??ex.weight?.match(/\d+/)?.[0]??20;
    const w=fmtW(storedWeight);
    const r=s?.reps??ex.reps?.match(/^\d+/)?.[0]??'10';
    return `<div class="set-row${isDone?' done':''}" id="sr-${ex.id}-${i}">
      <div class="set-num">${i+1}</div>
      <div class="set-inp-wrap">
        <button class="set-adj" onclick="adj('${ex.id}',${i},'w',-2.5)">−</button>
        <input class="set-inp" type="number" id="sw-${ex.id}-${i}" value="${w}" inputmode="decimal" onchange="updSet('${ex.id}',${i},'w',this.value)">
        <button class="set-adj" onclick="adj('${ex.id}',${i},'w',2.5)">+</button>
      </div>
      <div class="set-inp-wrap">
        <button class="set-adj" onclick="adj('${ex.id}',${i},'r',-1)">−</button>

      </div>
      <button class="set-chk${isDone?' on':''}" id="sc-${ex.id}-${i}" onclick="toggleSet('${ex.id}',${i})">${svgIcon('check',15,'var(--t3)')}</button>
    </div>`;
  }).join('');
  const cues=ex.cues.map(c=>`<div class="cue-item"><div class="cue-dot"></div>${c}</div>`).join('');
  const meta=[`${ex.sets} sets × ${ex.reps}`,ex.weight].filter(Boolean).join(' · ');
  const where=ex.where?`<div class="ex-where"><div class="cue-title">Where to find it</div>${ex.where}</div>`:'';
  const sdone=(exLog?.sets||[]).filter(s=>s?.done).length;
  return `<div class="ex-card${done?' completed':''}" id="ec-${ex.id}">
    <div class="ex-hdr" onclick="toggleEx('${ex.id}')">
      <div class="ex-icon">${svgIcon('dumbbell',20,'var(--blue)')}</div>
      <div class="ex-info">
        <div class="ex-name"><span>${ex.name}</span></div>
        <div class="ex-subline"><div class="ex-meta">${meta}</div>${ex.muscle?`<div class="ex-muscle">${ex.muscle}</div>`:''}</div>
      </div>
      <div class="ex-done-badge">${svgIcon('check',12,'#000')}</div>
      <div class="ex-chevron">${svgIcon('chevD',16,'var(--t3)')}</div>
    </div>
    <div class="ex-body" id="eb-${ex.id}">
      <div class="ex-body-inner">
        <div class="set-hdr">
          <div class="set-hdr-lbl">Set</div>
          <div class="set-hdr-lbl">Weight (${wUnit()})</div>
          <div class="set-hdr-lbl">Reps</div>
          <div class="set-hdr-lbl">✓</div>
        </div>
        ${setRows}
        <div class="rest-bar" id="rb-${ex.id}">
          <div class="rest-lbl">Rest time</div>
          <div class="rest-cd" id="rc-${ex.id}">--:--</div>
          <button class="rest-skip" onclick="stopRest('${ex.id}')">Skip</button>
        </div>
        <div class="form-cues">${where}<div class="cue-title">Form cues</div>${cues}</div>
        <button class="ex-complete-btn${done?' done':''}" id="ecb-${ex.id}" onclick="completeEx('${ex.id}')">
          ${done?'\u2713 Complete':`Done, skip the set details (${sdone}/${ex.sets} logged)`}

function toggleEx(id){const c=document.getElementById('ec-'+id);if(c)c.classList.toggle('open');}
function switchDay(i){S.workoutDay=i;renderScreen(1);}
function adj(exId,i,field,delta){
  const id=field==='w'?`sw-${exId}-${i}`:`sr-inp-${exId}-${i}`;
  const el=document.getElementById(id);if(!el)return;
  let v=parseFloat(el.value)||0;
  v=Math.max(0,v+delta);
  el.value=field==='w'?v.toFixed(1):Math.round(v);
  updSet(exId,i,field,el.value);
}
function updSet(exId,i,field,val){
  if(!S.log.workout.exercises[exId])S.log.workout.exercises[exId]={sets:[],completed:false};
  if(!S.log.workout.exercises[exId].sets)S.log.workout.exercises[exId].sets=[];
  if(!S.log.workout.exercises[exId].sets[i])S.log.workout.exercises[exId].sets[i]={};
  S.log.workout.exercises[exId].sets[i][field==='w'?'weight':'reps']=field==='w'?fromDisp(parseFloat(val)):parseInt(val);
  DB.saveLog(S.today,S.log);
}
function toggleSet(exId,i){
  if(!S.log.workout.exercises[exId])S.log.workout.exercises[exId]={sets:[],completed:false};
  const exLog=S.log.workout.exercises[exId];
  if(!exLog.sets)exLog.sets=[];
  if(!exLog.sets[i])exLog.sets[i]={};
  const w=document.getElementById(`sw-${exId}-${i}`)?.value;
  const r=document.getElementById(`sr-inp-${exId}-${i}`)?.value;
  if(w)exLog.sets[i].weight=fromDisp(parseFloat(w));
  if(r)exLog.sets[i].reps=parseInt(r);
  exLog.sets[i].done=!exLog.sets[i].done;
  DB.saveLog(S.today,S.log);
  const row=document.getElementById(`sr-${exId}-${i}`);
  const chk=document.getElementById(`sc-${exId}-${i}`);
  const num=row?.querySelector('.set-num');
  if(row)row.classList.toggle('done',exLog.sets[i].done);
  if(chk)chk.classList.toggle('on',exLog.sets[i].done);
  if(num&&exLog.sets[i].done){num.style.transform='scale(0)';setTimeout(()=>{num.style.transition='transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';num.style.transform='scale(1)';},60);}
  const ex=S.workout.days[S.workoutDay].exercises.find(e=>e.id===exId);
  if(ex){
    const sdone=(exLog.sets||[]).filter(s=>s?.done).length;
    const btn=document.getElementById('ecb-'+exId);
    if(btn&&!exLog.completed)btn.textContent=`Mark complete (${sdone}/${ex.sets} sets done)`;
    if(exLog.sets[i].done)startRest(exId,ex.restSec||90);
  }
}
function startRest(exId,secs){
  if(S.restTimers[exId])clearInterval(S.restTimers[exId].t);
  const bar=document.getElementById('rb-'+exId);
  const cd=document.getElementById('rc-'+exId);
  if(!bar||!cd)return;
  bar.classList.add('show');
  let rem=secs;
  cd.textContent=fmtTime(rem);
  const t=setInterval(()=>{
    rem--;
    const el=document.getElementById('rc-'+exId);
    if(el)el.textContent=fmtTime(rem);
    if(rem<=0){clearInterval(t);delete S.restTimers[exId];const b=document.getElementById('rb-'+exId);if(b)b.classList.remove('show');toast('⏱️','Rest complete!','Time for next set');}
  },1000);
  S.restTimers[exId]={t};
}
function stopRest(exId){
  if(S.restTimers[exId]){clearInterval(S.restTimers[exId].t);delete S.restTimers[exId];}
  const bar=document.getElementById('rb-'+exId);
  if(bar)bar.classList.remove('show');
}
function completeEx(exId){
  if(!S.log.workout.exercises[exId])S.log.workout.exercises[exId]={sets:[],completed:false};
  S.log.workout.exercises[exId].completed=true;
  DB.saveLog(S.today,S.log);
  stopRest(exId);
  const card=document.getElementById('ec-'+exId);
  const btn=document.getElementById('ecb-'+exId);
  if(card){card.classList.add('completed');card.classList.remove('open');}
  if(btn){btn.textContent='✓ Complete';btn.classList.add('done');}
  const d=S.workout.days[S.workoutDay];
  const done=d.exercises.filter(e=>S.log.workout.exercises[e.id]?.completed).length;
  const prog=document.getElementById('wk-prog');
  if(prog)prog.style.width=(done/d.exercises.length*100)+'%';
  const label=document.querySelector('#s1 .workout-progress-count');
  if(label)label.textContent=`${done}/${d.exercises.length} exercises done`;
  if(done>0&&!document.querySelector('.finish-btn'))renderScreen(1);
}
/* One tap for a session he already did and does not want to retype. It is
   confirmed first, because it marks every exercise done at once and a mistap
   would otherwise silently claim a workout he has not had yet. */
function confirmWholeSession(){
  const d=S.workout.days[S.workoutDay];
  openSheet(`<div class="sheet-body">
    <div style="font-size:15px;font-weight:600;margin-bottom:6px">${d.name}, all ${d.exercises.length} exercises</div>
    <div style="font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:18px">Marks the session done without set by set numbers. Nothing is recorded about weights, so your progress chart learns nothing from today. Use it when you trained but did not log as you went.</div>
    <button class="sheet-btn sheet-btn-primary" onclick="logWholeSession()">Log the session</button>
  </div>`,'Log whole session');
}
function logWholeSession(){
  const d=S.workout.days[S.workoutDay];
  for(const e of d.exercises){
    if(!S.log.workout.exercises[e.id])S.log.workout.exercises[e.id]={sets:[],completed:false};
    S.log.workout.exercises[e.id].completed=true;
  }
  closeSheet();
  finishWorkout();
}
function finishWorkout(){
  S.log.workout.completed=true;
  S.log.workout.dayIndex=S.workoutDay;
  S.log.workout.startTime=S.log.workout.startTime||new Date().toISOString();
  S.log.checkins.gym=true;
  DB.saveLog(S.today,S.log);
  const d=S.workout.days[S.workoutDay];
  const exDone=d.exercises.filter(e=>S.log.workout.exercises[e.id]?.completed).length;
  celebrate('\u{1F3CB}','Workout complete',`${d.name}, ${exDone} exercises logged. Three a week is the whole plan, and this was one of them.`);
  renderScreen(1);
}

/* The food database is data/foods.json, not inlined here. Those entries would
   roughly double the size of this file, and it is a data file edited on its own
   schedule. The service worker is network-first with a cache fallback, so this
   keeps working offline after the first load. PRESETS stay inline as the
   guaranteed core for a very first run with no network at all. */
async function loadFoods(){
  try{
    const r=await fetch('./data/foods.json');
    if(!r.ok)return;
    const d=await r.json();
    if(Array.isArray(d.entries))S.foods=d.entries;
  }catch(e){}
}
/* Custom foods win over the shipped database, which wins over the inline
   presets, so a correction he makes himself is never shadowed by ours. */
function allFoods(){
  const seen=new Set(),out=[];
  for(const f of [...DB.customFoods(),...S.foods,...PRESETS]){
    const k=(f.name||'').toLowerCase().trim();
    if(!k||seen.has(k))continue;
    seen.add(k);out.push(f);
  }
  return out;
}
function findFood(id){return allFoods().find(f=>f.id===id);}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function confBadge(f){
  const c=CONF[f.conf];
  if(!c)return '';
  return '<span class="conf '+c[0]+'" title="'+esc(f.src||'')+'">'+c[1]+'</span>';
}
function foodHistoryIndex(logs,foods){
  const out=Object.create(null),byName=Object.create(null);
  for(const f of foods||[])if(f&&f.id)byName[String(f.name||'').toLowerCase().trim()]=f.id;
  for(const [date,log] of Object.entries(logs||{})){
    for(const meal of log?.nutrition?.meals||[]){
      const name=String(meal.name||'').toLowerCase().trim();
      const base=name.replace(/ \(\d+(?:\.\d+)?g\)$/,'');
      const id=meal.foodId||byName[name]||byName[base];
      if(!id)continue;
      const h=out[id]||(out[id]={count:0,last:''});
      h.count++;
      if(date>h.last)h.last=date;
    }
  }
  return out;
}
/* Match quality beats personal history, history beats popularity, and the
   existing usual-item tag breaks only the remaining ties. */
function searchFoods(m,foods,history){
  const hit=[];
  for(const f of foods||[]){
    const n=(f.name||'').toLowerCase(), b=(f.brand||'').toLowerCase();
    let quality;
    if(n.startsWith(m))quality=0; else if(b.startsWith(m))quality=1; else if(n.includes(m))quality=2; else if(b.includes(m))quality=3; else continue;
    hit.push({quality,f,h:history?.[f.id]||null});
  }
  return hit.sort((a,b)=>{
    if(a.quality!==b.quality)return a.quality-b.quality;
    const ah=a.h?.count||0,bh=b.h?.count||0;
    if(!!ah!==!!bh)return ah?-1:1;
    if(ah&&bh){if(ah!==bh)return bh-ah;if(a.h.last!==b.h.last)return b.h.last.localeCompare(a.h.last);}
    else if((a.f.pop||0)!==(b.f.pop||0))return (b.f.pop||0)-(a.f.pop||0);
    const au=(a.f.tags||[]).includes('his-usual'),bu=(b.f.tags||[]).includes('his-usual');
    if(au!==bu)return au?-1:1;
    return String(a.f.name||'').localeCompare(String(b.f.name||''));
  }).slice(0,10).map(x=>x.f);
}

/* ── ONBOARDING ─────────────────────────────────────────────────────────
   The app shipped with one person's body hardcoded into DEF_SETTINGS. That is
   fine for one user and useless the moment he sends the link to a friend, who
   would silently inherit his height, his weight and his calorie target.

   Kept short on purpose. The people installing this describe themselves the
   same way he does, and a fitness app that opens with a twenty field form gets
   closed and never opened again. */
function computeTargets(d){
  const w=d.weightKg,h=d.heightCm,age=d.age,male=d.sex!=='female';
  /* Mifflin-St Jeor. Katch-McArdle is better above roughly 30 percent body fat
     but needs a lean mass figure nobody has on day one, and the app replaces
     all of this with a measured maintenance number once there is data. */
  const bmr=Math.round(10*w+6.25*h-5*age+(male?5:-161));
  /* Deliberately low multipliers. Three gym sessions on top of an otherwise
     sedentary week is not an active lifestyle, and overstating it sets a target
     that quietly stalls progress and reads as the plan not working. */
  const mult=d.sessions>=5?1.35:d.sessions>=3?1.25:d.sessions>=1?1.2:1.15;
  const tdee=Math.round(bmr*mult);
  /* On a GLP-1 the failure mode is undereating, not overeating: appetite is
     suppressed and lean mass is what gets spent. So, a smaller deficit. */
  const deficit=d.glp1?300:500;
  const floor=Math.max(1400,Math.round(bmr*0.95/50)*50);
  const calories=Math.max(floor,Math.round((tdee-deficit)/50)*50);
  const protein=Math.round(w*2.1);
  const fat=Math.round(w*0.84);
  const carbs=Math.max(50,Math.round((calories-protein*4-fat*9)/4));
  /* 49 ml per kg, rounded to the nearest 250 so the target is a number he can
     hold in his head and hit with whole bottles rather than a precise 3.488. */
  const water=Math.round(w*49/250)*250;
  return {bmr,tdee,calories,protein,carbs,fat,water,steps:8000,creatine:d.creatine?5:0,floor};
}

/* Inverts the x component of --ease-data (cubic-bezier(.22,1,.36,1)) so the
   count-up carries the same exact-number motion as the app's rings and bars. */
function obEaseData(x){
  if(x<=0)return 0;if(x>=1)return 1;
  let lo=0,hi=1,t=.5;
  for(let i=0;i<12;i++){
    t=(lo+hi)/2;
    const inv=1-t,bx=3*inv*inv*t*.22+3*inv*t*t*.36+t*t*t;
    if(bx<x)lo=t;else hi=t;
  }
  return 1-Math.pow(1-t,3);
}

/* ── PREDICTION ─────────────────────────────────────────────────────────
   Everything below is deliberately pessimistic. He asked for that in those
   words, and it is also the only version that survives contact with reality:
   an app that promises 65 kg by October and misses gets deleted in November.

   Every number here degrades to an honest not-enough-data-yet rather than
   guessing from three data points. Saying nothing is always available. */
const KCAL_PER_KG=7700;   /* energy in a kg of body fat, the standard figure */

/* Scale weight is mostly water. A single reading moves a kilo on salt and
   carbs alone, which on a 0.4 kg per week goal is a whole week of signal
   buried in noise. An exponential average with a 10 day half life is the
   standard fix, and it is time aware so a week of missed weigh-ins does not
   get treated as a week of no change. */
function trendSeries(weights,halfLife){
  const hl=halfLife||10;
  const w=(weights||[]).filter(x=>x&&x.date&&typeof x.weight==='number').slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!w.length)return [];
  const out=[{date:w[0].date,trend:w[0].weight}];
  for(let i=1;i<w.length;i++){
    const dt=Math.max(1,(new Date(w[i].date+'T12:00:00')-new Date(w[i-1].date+'T12:00:00'))/86400000);
    const a=1-Math.pow(0.5,dt/hl);
    out.push({date:w[i].date,trend:out[i-1].trend+a*(w[i].weight-out[i-1].trend)});

}
/* Least squares slope in kg per week over the trailing window. Needs a real
   span, not just a count: five weigh-ins in one week say nothing about a rate. */
function weeklyRate(trend,days){
  if(!trend||trend.length<3)return null;
  const end=new Date(trend[trend.length-1].date+'T12:00:00');
  const pts=trend.filter(t=>(end-new Date(t.date+'T12:00:00'))/86400000<=days)
    .map(t=>[(new Date(t.date+'T12:00:00')-end)/86400000,t.trend]);
  if(pts.length<3)return null;
  if(Math.abs(pts[0][0])<14)return null;
  const n=pts.length;
  const mx=pts.reduce((a,q)=>a+q[0],0)/n, my=pts.reduce((a,q)=>a+q[1],0)/n;
  let num=0,den=0;
  for(const q of pts){num+=(q[0]-mx)*(q[1]-my);den+=(q[0]-mx)*(q[0]-mx);}
  if(!den)return null;
  return (num/den)*7;   /* kg per week, negative means losing */

function estimateTDEE(days){
  const trend=trendSeries(DB.weights());
  if(trend.length<3)return {ok:false,why:'Needs at least three weigh-ins.'};
  const last=trend[trend.length-1];
  const first=trend.find(t=>(new Date(last.date+'T12:00:00')-new Date(t.date+'T12:00:00'))/86400000<=days);
  if(!first)return {ok:false,why:'Needs a longer run of weigh-ins.'};
  const span=Math.round((new Date(last.date+'T12:00:00')-new Date(first.date+'T12:00:00'))/86400000);
  if(span<14)return {ok:false,why:'Needs at least two weeks between weigh-ins.'};
  let logged=0,total=0;
  for(let i=0;i<span;i++){
    const l=DB.log(shiftDate(last.date,-i));
    const cal=l&&l.nutrition?(l.nutrition.meals||[]).reduce((a,m)=>a+(m.cal||0),0):0;
    if(cal>0){logged++;total+=cal;}
  }
  const need=Math.ceil(span*0.6);
  if(logged<need)return {ok:false,why:'Only '+logged+' of the last '+span+' days have food logged. This needs about '+need+'.'};
  const meanIntake=total/logged;
  const deltaKg=last.trend-first.trend;
  const tdee=Math.round(meanIntake-(deltaKg*KCAL_PER_KG/span));
  /* A back-calculated number outside this band means the input is wrong, most
     likely unlogged food, so it is refused rather than shown. */
  if(tdee<1200||tdee>4000)return {ok:false,why:'The numbers do not add up, which usually means some days of eating went unlogged.'};
  return {ok:true,tdee,meanIntake:Math.round(meanIntake),logged,span,deltaKg};
}

function projectTarget(){
  const trend=trendSeries(DB.weights());
  if(trend.length<3)return {ok:false,why:'Three weigh-ins at least a fortnight apart and this starts working.'};
  const cur=trend[trend.length-1].trend;
  const target=S.cfg.body.targetWeight;
  if(cur<=target)return {ok:true,done:true,cur};
  const rates=[weeklyRate(trend,28),weeklyRate(trend,3650)].filter(x=>x!==null);
  if(!rates.length)return {ok:false,why:'Not enough weigh-ins spread over enough days yet.',cur};
  const rate=Math.max.apply(null,rates);   /* least negative, so the slower loss */
  /* Gaining is a different fact from not losing, and rounding it into the same
     sentence is the kind of softening that makes the whole screen untrustworthy. */
  if(rate>0.05)return {ok:false,why:"The trend is up, not down, by "+Math.abs(toDisp(rate)).toFixed(2)+" "+wUnit()+" a week. No date is projected from that.",cur,rate};
  if(rate>-0.05)return {ok:false,why:'No measurable downward trend yet. That is information, not failure: it usually means intake is closer to maintenance than it feels.',cur,rate};
  const weeks=(cur-target)/Math.abs(rate);
  if(weeks>104)return {ok:false,why:'At the current rate this is more than two years out, which is not a useful projection.',cur,rate};

function calcStreak(all,field){
  let s=0;
  for(let i=0;i<90;i++){
    const k=shiftDate(S.today,-i);
    if(all[k]?.checkins?.[field])s++;else break;
  }
  return s;
}
function buildCal(){
  const now=S.calMonth||new Date(),y=now.getFullYear(),m=now.getMonth();
  const all=DB.allLogs(),mName=now.toLocaleDateString('en-CA',{month:'long',year:'numeric'});
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const dls=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-day-lbl">${d}</div>`).join('');
  let cells='';
  for(let i=0;i<first;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const log=all[ds],isT=ds===S.today;
    let dots='';
    if(log){if(log.workout?.completed)dots+=`<div class="cal-cell-dot" style="background:var(--orange)"></div>`;if(log.checkins?.protein&&log.checkins?.water)dots+=`<div class="cal-cell-dot" style="background:var(--green)"></div>`;else if(log.checkins?.protein||log.checkins?.water)dots+=`<div class="cal-cell-dot" style="background:var(--blue-light)"></div>`;}
    cells+=`<div class="cal-cell${isT?' today':''}" onclick="showDay('${ds}')"><span>${d}</span><div style="display:flex;gap:2px">${dots}</div></div>`;
  }
  return `<div class="cal-hdr"><div class="cal-month">${mName}</div><div class="cal-nav"><button class="cal-nav-btn" onclick="calNav(-1)">${svgIcon('chevL',14,'var(--t2)')}</button><button class="cal-nav-btn" onclick="calNav(1)">${svgIcon('chevR',14,'var(--t2)')}</button></div></div>
  <div class="cal-days-hdr">${dls}</div><div class="cal-grid">${cells}</div>
  <div style="margin-top:12px;display:flex;gap:12px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t2)"><div style="width:8px;height:8px;border-radius:50%;background:var(--orange)"></div>Trained</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t2)"><div style="width:8px;height:8px;border-radius:50%;background:var(--green)"></div>All goals hit</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t2)"><div style="width:8px;height:8px;border-radius:50%;background:var(--blue-light)"></div>Partial</div>
  </div>`;
}
function calNav(dir){const d=S.calMonth||new Date();S.calMonth=new Date(d.getFullYear(),d.getMonth()+dir,1);const c=document.getElementById('cal-card');if(c)c.innerHTML=buildCal();}
function showDay(ds){
  const all=DB.allLogs(),log=all[ds];

  if(!log){openSheet(`<div style="padding:0 20px 20px;text-align:center;color:var(--t3)"><div style="font-size:32px;margin:16px 0 10px">📅</div><div style="font-size:15px;font-weight:500">No data logged for this day</div></div>`,dl);return;}
  const meals=log.nutrition?.meals||[];
  const tCal=meals.reduce((a,m)=>a+(m.cal||0),0),tProt=meals.reduce((a,m)=>a+(m.protein||0),0);
  openSheet(`<div style="padding:0 20px 20px">
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">
      ${log.checkins?.gym?'<div style="background:var(--orange-dim);color:var(--orange-text);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:600;border:1px solid var(--orange-border)">🏋️ Trained</div>':''}
      ${log.checkins?.protein?'<div style="background:var(--coral-dim);color:var(--coral-text);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:600;border:1px solid var(--coral-border)">🥩 Protein ✓</div>':''}
      ${log.checkins?.water?'<div style="background:var(--blue-dim);color:var(--blue-light-text);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:600;border:1px solid var(--blue-border)">💧 Water ✓</div>':''}
    </div>
    ${log.workout?.completed?`<div style="background:var(--s2);border-radius:var(--r-md);padding:12px;margin-bottom:10px"><div style="font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">Workout</div><div style="font-size:15px;font-weight:600">${S.workout.days[log.workout.dayIndex]?.name||'Workout'}, ${S.workout.days[log.workout.dayIndex]?.label||''}</div></div>`:''}
    ${tCal>0?`<div style="background:var(--s2);border-radius:var(--r-md);padding:12px;margin-bottom:10px">
      <div style="font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Nutrition</div>
      <div class="flex-bc" style="margin-bottom:6px"><span style="font-size:13px;color:var(--t2)">Calories</span><span style="font-size:14px;font-weight:700;color:var(--orange-text)">${Math.round(tCal)} kcal</span></div>
      <div class="flex-bc" style="margin-bottom:6px"><span style="font-size:13px;color:var(--t2)">Protein</span><span style="font-size:14px;font-weight:700;color:var(--coral-text)">${Math.round(tProt)}g</span></div>
      <div class="flex-bc"><span style="font-size:13px;color:var(--t2)">Water</span><span style="font-size:14px;font-weight:700;color:var(--blue-light-text)">${fmtVolBig(log.nutrition?.water||0)}</span></div>
    </div>`:''}
    ${log.weight?`<div class="flex-bc" style="background:var(--s2);border-radius:var(--r-md);padding:12px;margin-bottom:10px"><span style="font-size:13px;color:var(--t2)">Weight</span><span style="font-size:16px;font-weight:800;color:var(--purple-text)">${fmtWU(log.weight)}</span></div>`:''}
    ${log.steps>0?`<div class="flex-bc" style="background:var(--s2);border-radius:var(--r-md);padding:12px"><span style="font-size:13px;color:var(--t2)">Steps</span><span style="font-size:16px;font-weight:800;color:var(--green-text)">${log.steps.toLocaleString()}</span></div>`:''}
  </div>`,dl);
}
function setRange(r){
  S.chartRange=r;
  if(S.wtChart){S.wtChart.destroy();S.wtChart=null;}
  document.querySelectorAll('.range-tab').forEach(t=>{t.classList.toggle('active',t.textContent===r+'d');});
  buildChart();
}
function buildChart(){
  const canvas=document.getElementById('wt-chart');
  if(!canvas||typeof Chart==='undefined')return;
  if(S.wtChart){S.wtChart.destroy();S.wtChart=null;}
  const wh=DB.weights(),days=S.chartRange;
  const cut=new Date();cut.setDate(cut.getDate()-days);
  const filtered=wh.filter(w=>new Date(w.date+'T12:00:00')>=cut);
  if(filtered.length===0)filtered.push({date:S.today,weight:S.cfg.body.currentWeight});
  const labels=filtered.map(w=>{const d=new Date(w.date+'T12:00:00');return `${d.getMonth()+1}/${d.getDate()}`;});
  /* toDisp(), not the raw stored kilograms: the chart used to plot kg no
     matter what unit was selected, the one screen the lb toggle never
     reached. */
  const data=filtered.map(w=>toDisp(w.weight));
  /* Read from the live CSS custom properties rather than hardcoded hex, so
     the chart follows the active theme instead of staying dark-on-dark
     colours when the page around it has gone light. */
  const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
  const purple=v('--purple-text'),green=v('--green-text'),surface=v('--s2'),
        text=v('--t1'),tipBorder=v('--border2'),tick=v('--t3'),grid=v('--border');
  S.wtChart=new Chart(canvas,{type:'line',data:{labels,datasets:[
    {label:'Weight',data,borderColor:purple,backgroundColor:purple+'12',borderWidth:2.5,pointBackgroundColor:purple,pointRadius:4,pointHoverRadius:6,fill:true,tension:0.4},
    {label:'Target',data:Array(labels.length).fill(toDisp(S.cfg.body.targetWeight)),borderColor:green+'73',borderWidth:1.5,borderDash:[5,5],pointRadius:0,fill:false},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:surface,titleColor:purple,bodyColor:text,borderColor:tipBorder,borderWidth:1,padding:10}},scales:{x:{grid:{color:grid},ticks:{color:tick,font:{size:10},maxTicksLimit:6}},y:{grid:{color:grid},ticks:{color:tick,font:{size:10}}}},animation:{duration:800,easing:'easeOutQuart'}}});
}

function notifRow(key,label,time){
  const on=S.cfg.notifications?.[key]?.enabled!==false;
  /* A preference switched on while nothing is subscribed is not a reminder
     that will arrive. Showing it as on is how someone ends up believing the
     app is nudging them for a week while it sends nothing at all. */
  const live=S.pushStatus==='live';
  const [color,dim]={water:['var(--blue-text)','var(--blue-dim)'],gym:['var(--orange-text)','var(--orange-dim)'],weight:['var(--purple-text)','var(--purple-dim)'],dose:['var(--green-text)','var(--green-dim)']}[key]||['var(--t2)','var(--s2)'];
  return `<div class="settings-row"${live?'':' style="opacity:.55"'}>
    <div class="sr-icon" style="background:${dim}">${svgIcon('bell',18,color)}</div>
    <div><div class="sr-lbl">${label}</div><div style="font-size:11px;color:var(--t3)">${live?time:'Not delivering yet'}</div></div>
    <div class="toggle${on&&live?' on':''}" role="switch" aria-checked="${on&&live}" aria-label="${esc(label)}" onclick="toggleNotif('${key}')"><div class="toggle-knob"></div></div>
  </div>`;
}
/* One honest line above the four toggles. Each state names the actual next
   action rather than saying something vague went wrong. */
function pushBanner(){
  const st=S.pushStatus;
  if(st==='live')return '';
  const msg={
    unknown:['Checking reminders...',''],
    unsupported:['This browser cannot receive reminders','Open FitTrack in Chrome on Android, or Safari on iPhone.'],
    blocked:['Reminders are blocked','Notifications were denied for this site. Re-allow them in your browser site settings.'],
    off:['Reminders are not switched on yet','The toggles below do nothing until you enable notifications.'],
  }[st]||['Reminders are not switched on yet',''];
  return `<div class="settings-grp" style="margin-bottom:10px">
    <div class="settings-row" onclick="openNotifInfo()">
      <div class="sr-icon" style="background:var(--orange-dim)">${svgIcon('bell',18,'var(--orange-text)')}</div>
      <div><div class="sr-lbl">${msg[0]}</div><div style="font-size:11px;color:var(--t2);line-height:1.45">${msg[1]}</div></div>
      <div class="sr-arrow">${svgIcon('chevR',14,'var(--t3)')}</div>
    </div>
  </div>`;
}
function toggleNotif(key){
  if(!S.cfg.notifications)S.cfg.notifications={};
  if(!S.cfg.notifications[key])S.cfg.notifications[key]={enabled:true};
  S.cfg.notifications[key].enabled=!S.cfg.notifications[key].enabled;
  DB.saveSettings(S.cfg);
  renderScreen(4);
  /* The server holds the preferences the cron reads, so a toggle that only
     landed locally is a toggle that did not take effect. On a phone that
     failure is routine, not exceptional: a lift, a tunnel, a dead zone. */
  syncPush().then(ok=>{
    if(!ok&&S.pushStatus==='live')toast('⚠️','Saved on this phone only','It will sync next time you open the app');
  });
}
/* Retained deliberately: the settings row that called this is hidden, not

function openSheet(content,title=''){
  const sw=document.getElementById('sheet-wrap'),bd=document.getElementById('backdrop');
  sw.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"${title?' aria-label="'+esc(title)+'"':''}>
    <div class="sheet-handle"></div>
    ${title?`<div class="sheet-hdr"><div class="sheet-title">${title}</div><button class="sheet-close" aria-label="Close" onclick="closeSheet()">${svgIcon('x',13,'var(--t2)')}</button></div>`:''}
    ${content}
  </div>`;
  requestAnimationFrame(()=>{bd.classList.add('show');sw.classList.add('show');});
  /* Move focus into the sheet, or a keyboard and a screen reader are both left
     behind on the element that opened it. A text input wins when there is one,
     because every sheet that has one exists to have it typed into. */
  requestAnimationFrame(()=>{
    const first=sw.querySelector('input,textarea,select,button');
    if(first)try{first.focus({preventScroll:true});}catch(e){}
  });
  bd.onclick=closeSheet;
}

  if(S.screen===3)renderScreen(3);if(S.screen===0)renderScreen(0);
}
