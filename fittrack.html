/* ── PUSH NOTIFICATIONS ─────────────────────────────────
   The old version used in-page setTimeout + new Notification(). Those timers
   die the instant the PWA is backgrounded, which is exactly why every toggle
   read "on" and nothing ever arrived. Real delivery needs a service worker
   plus a server that can send while the app is closed.

   PUSH_API empty means the reminder server is not deployed yet. The app still
   registers the worker and subscribes, and says so plainly rather than
   claiming reminders are live when nothing is scheduled. */
const PUSH_API='https://fittrack-push.addyrallxx.workers.dev';
const VAPID_PUBLIC='BB3_s3JhI7PA6q8YLZYmKepjaW394uuyxkzjWUz2Bm3HMguRlYv3v5rOeU_KaL_JCpz1uLqb0sQgIx-75a3RC_0';

function urlB64ToU8(s){
  const pad='='.repeat((4-s.length%4)%4);
  const raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw,c=>c.charCodeAt(0));
}
/* Stable per-device id. Not an account: it only needs to be unique enough for
   the server to key one subscription and one set of preferences off. */
function deviceId(){
  let id=DB.get('ft_uid','');
  if(!id){
    /* A bearer token, so it comes from a CSPRNG. Math.random() is seeded
       predictably enough that ids generated near each other are guessable. */
    id='u_'+(self.crypto&&crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,20)
      :Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(16).padStart(2,'0')).join(''));
    DB.set('ft_uid',id);
  }
  return id;
}
function tzName(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Edmonton';}catch(e){return 'America/Edmonton';}}
function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
/* iOS has no Push API in an ordinary Safari tab, at any version. Only an
   installed home-screen app gets one, so this decides which advice to show. */
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
/* Chrome fires this instead of installing, and the event is the only handle on
   the native install flow. Android has no equivalent of iOS's Share sheet
   instructions, so without capturing it there is no way to offer an install
   button at all. */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
window.addEventListener('appinstalled',()=>{deferredInstall=null;});
async function promptInstall(){
  if(!deferredInstall){toast('ℹ️','Use the browser menu','Chrome menu, then Install app');return;}
  closeSheet();
  deferredInstall.prompt();
  try{await deferredInstall.userChoice;}catch(e){}
  deferredInstall=null;
}

async function sendSub(sub){
  if(!PUSH_API||!sub)return false;
  try{
    const cfg={waterGoal:S.cfg.targets&&S.cfg.targets.water||3500,gymTarget:S.cfg.gymTarget??3,dose:null};
    if(S.cfg.dose&&Array.isArray(S.cfg.dose.steps)&&S.cfg.dose.steps.length){
      cfg.dose={med:S.cfg.dose.med||'GLP-1 medication',steps:S.cfg.dose.steps};
    }
    const r=await fetch(PUSH_API+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:deviceId(),tz:tzName(),sub,prefs:S.cfg.notifications||{},
        cfg})});
    return r.ok;
  }catch(e){return false;}
}
/* Sessions completed in the current week, which runs Monday to Sunday to match
   the Monday weigh-in and dose. The server needs the count, not the dates: it
   decides whether to nudge from sessions left against days left. */
function gymWeekCount(){
  const dow=(new Date(S.today+'T12:00:00').getDay()+6)%7;   /* Mon=0 */
  let n=0;
  for(let i=0;i<=dow;i++){
    const l=DB.log(shiftDate(S.today,-i));
    if(l&&l.workout&&l.workout.completed)n++;
  }
  return n;
}
/* Report only the fields the reminder rules read. The server never
   becomes a second copy of the log: everything else stays on the phone.
   Debounced, because logging a workout writes the log once per set and only
   the final numbers matter. */
let stTimer=null;
function queueState(){
  if(!PUSH_API)return;
  clearTimeout(stTimer);
  stTimer=setTimeout(pushState,4000);
}
async function pushState(){
  if(!PUSH_API)return false;
  try{
    const l=DB.log(S.today)||{};
    const wh=DB.weights();
    const r=await fetch(PUSH_API+'/state',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        id:deviceId(),
        water:(l.nutrition&&l.nutrition.water)||0,
        gymDone:(l.workout&&l.workout.completed)?S.today:null,
        gymWeek:gymWeekCount(),
        weightLogged:(wh.length&&wh[wh.length-1].date===S.today)?S.today:null,
      })});
    return r.ok;
  }catch(e){return false;}
}
/* Deliberately asks the SERVER to send it, rather than showing one locally.
   A local notification proves nothing: the whole failure being fixed here was
   that reminders never arrived while the app was closed. */
async function testPush(){
  if(!PUSH_API){toast('⏳','Server not live yet','Reminders start once it is deployed');return;}
  if(!('Notification' in window)||Notification.permission!=='granted'){openNotifInfo();return;}
  toast('📡','Asking the server...','It should arrive in a moment');
  try{
    const r=await fetch(PUSH_API+'/test',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:deviceId()})});
    if(r.status===404){await syncPush();toast('🔄','Re-registered','Try the test once more');return;}
    if(!r.ok)toast('❌','Server could not send','Check the worker logs');
  }catch(e){toast('❌','Could not reach the server','Check your connection');}
}
/* Re-post whatever subscription exists. Called on launch and whenever a
   reminder toggle changes, so the server's copy cannot drift from the app's. */
async function syncPush(){
  if(!('serviceWorker' in navigator))return false;
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    if(!reg)return false;
    let sub=await reg.pushManager.getSubscription();
    /* No subscription but permission still granted is the normal iOS failure:
       the OS drops the subscription after a stretch of not opening the app, and
       nothing tells the page. Left alone the toggle keeps saying "on" and not
       one reminder ever arrives again. Re-subscribing here is what makes a
       lapsed install heal itself the next time it is opened. */
    if(!sub&&('Notification' in window)&&Notification.permission==='granted'){
      try{sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToU8(VAPID_PUBLIC)});}
      catch(e){return false;}
    }
    return sub?sendSub(sub.toJSON()):false;
  }catch(e){return false;}
}
/* Asks the browser rather than the settings blob. 'live' means permission is
   granted AND a subscription object exists, which together are the only
   conditions under which the server can reach this device. */
async function refreshPushStatus(){
  let st;
  if(!('Notification' in window)||!('serviceWorker' in navigator))st='unsupported';
  else if(Notification.permission==='denied')st='blocked';
  else if(Notification.permission!=='granted')st='off';
  else{
    try{
      const reg=await navigator.serviceWorker.getRegistration();
      const sub=reg&&await reg.pushManager.getSubscription();
      st=sub?'live':'off';
    }catch(e){st='off';}
  }
  if(st===S.pushStatus)return st;
  S.pushStatus=st;
  if(S.screen===4)renderScreen(4);
  return st;
}
function initPush(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js',{scope:'./'}).then(async()=>{
    if(('Notification' in window)&&Notification.permission==='granted'){await syncPush();pushState();}
    refreshPushStatus();
  }).catch(e=>{
    /* This is the path every ordinary launch takes. A console warning is
       invisible on a phone, so the settings screen has to be able to say that
       reminders are not running. */
    console.warn('SW registration failed',e);
    S.pushStatus='off';
    if(S.screen===4)renderScreen(4);
  });
  navigator.serviceWorker.addEventListener('message',e=>{
    const d=e.data||{};
    if(d.type==='action')handleAction(d.act);
    if(d.type==='resubscribed')sendSub(d.sub);
  });
}
/* Notification action buttons route through the same functions the on-screen
   buttons use, so a tap from the lock screen and a tap inside the app write
   identically. No parallel write path to keep in sync. */
function handleAction(act){
  if(!act)return;
  const p=String(act).split(':');
  /* Validate rather than defaulting. A NaN amount falling back to a plausible
     250 would silently log water that was never drunk, which is worse than
     ignoring the tap: the log is what every projection is built on. */
  if(p[0]==='water'){
    // Digits only. parseInt('250abc') is 250, and the hash form of this is
    // reachable from any link, so accept an exact number or nothing at all.
    if(!/^\d{1,4}$/.test(p[1]||''))return;
    const ml=parseInt(p[1],10);if(ml>0&&ml<=2000)addWater(ml);return;
  }
  if(p[0]==='weight'){openWeightSheet();return;}
  if(p[0]==='steps'){openStepsSheet(S.today);return;}
  if(p[0]==='gym'){go(1);return;}
  if(p[0]==='food'){go(2);return;}
}

function openNotifInfo(){
  const perm=('Notification' in window)?Notification.permission:'none';
  const install=isIOS()&&!isStandalone();
  /* Android can receive push from a browser tab, so this is not the hard block
     it is on iOS. Installing is still worth offering: an installed PWA survives
     tab eviction and gets its own notification channel in One UI settings. */
  const canInstall=!isIOS()&&!isStandalone()&&!!deferredInstall;
  let title,detail,cta=true;
  if(perm==='none'){title='Not supported here';detail='This browser cannot show notifications. Try Chrome on Android, or Safari on iPhone.';cta=false;}
  else if(install){title='Add to Home Screen first';detail='Tap Share, then Add to Home Screen, then open FitTrack from the new icon and come back here. An ordinary Safari tab cannot receive notifications at all, no matter what you allow.';cta=false;}
  else if(perm==='denied'){title='Blocked';detail='Notifications were denied for this site. Re-allow them in your browser site settings, then reopen this.';cta=false;}
  else if(perm==='granted'){title='Notifications are allowed';detail=PUSH_API?'Reminders are scheduled on the server, so they arrive whether or not the app is open.':'The reminder server is not live yet, so nothing is scheduled. Turning this on now means it starts working the moment it is.';}
  else{title='Set up reminders';detail='Water through the day, a nudge twice on gym days, weight on Monday morning, and your dose reminder. All of it runs on the server, so it works with the app closed.';}
  openSheet(`<div style="padding:0 20px 20px">
    <div style="font-size:15px;font-weight:700;color:var(--t1);margin-bottom:6px">${title}</div>
    <div style="font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:20px">${detail}</div>
    ${cta?'<button class="sheet-btn sheet-btn-primary" onclick="reqNotif()">Enable notifications</button>':''}
    ${canInstall?'<button class="sheet-btn sheet-btn-secondary" onclick="promptInstall()">Install app first</button>':''}
    <button class="sheet-btn sheet-btn-secondary" onclick="closeSheet()">${cta?'Not now':'Close'}</button>
  </div>`,'Notifications');
}
async function reqNotif(){
  if(!('Notification' in window)||!('serviceWorker' in navigator)){
    closeSheet();toast('❌','Not supported','This browser has no push support');return;
  }
  /* requestPermission must be the first thing awaited. On iOS the user-gesture
     context is lost across any earlier await and the prompt silently never
     appears, which looks identical to a bug. */
  let perm;
  try{perm=await Notification.requestPermission();}catch(e){perm='denied';}
  if(perm!=='granted'){closeSheet();toast('❌','Permission denied','Allow notifications in your site settings');return;}
  try{
    const reg=await navigator.serviceWorker.register('sw.js',{scope:'./'});
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToU8(VAPID_PUBLIC)});
    closeSheet();
    const ok=await sendSub(sub.toJSON());
    if(ok)toast('🔔','Reminders are live','Water, gym, weight and dose');
    else if(!PUSH_API)toast('🔔','Notifications allowed','Reminder server is not live yet');
    else toast('⚠️','Allowed, but not synced','Could not reach the reminder server');
    /* Fire one immediately through the service worker. It proves the whole
       pipeline end to end, and it is the difference between "it says on" and
       "I have seen one arrive". */
    reg.showNotification('FitTrack is set up',{body:'Your reminders will look like this.',badge:'badge-96.png',tag:'ft-setup'});
    refreshPushStatus();
  }catch(e){
    closeSheet();toast('❌','Could not subscribe',String(e&&e.message||e).slice(0,64));
  }
}
function exportData(){
  const data={settings:DB.get('ft_settings',{}),workout:DB.get('ft_workout',{}),logs:DB.allLogs(),weights:DB.weights(),customFoods:DB.customFoods(),exportDate:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`fittrack_backup_${S.today}.json`;a.click();
  URL.revokeObjectURL(url);toast('💾','Data exported!','Check your downloads folder');
}
function confirmClear(){
  openSheet(`<div style="padding:0 20px 20px;text-align:center">
    <div style="font-size:36px;margin:16px 0 12px">⚠️</div>
    <div style="font-size:17px;font-weight:700;margin-bottom:8px">Clear all data?</div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.5">This deletes ALL logs, history and progress permanently.</div>
    <button class="sheet-btn sheet-btn-danger" onclick="localStorage.clear();location.reload()">Yes, clear everything</button>
    <button class="sheet-btn sheet-btn-secondary" onclick="closeSheet()">Cancel</button>
  </div>`,'Warning');
}
/* ── CELEBRATION + TOAST ────────────────────── */
function celebrate(icon,title,sub){
  document.getElementById('cel-icon').textContent=icon;
  document.getElementById('cel-title').textContent=title;
  document.getElementById('cel-sub').textContent=sub;
  document.getElementById('celebration').classList.add('show');
  launchConfetti();
}
function hideCel(){document.getElementById('celebration').classList.remove('show');}
function launchConfetti(){
  const w=document.getElementById('confetti-wrap');if(!w)return;w.innerHTML='';
  const colors=['#FF9500','#30D158','#0A84FF','#BF5AF2','#FF6B6B','#FFD60A','#4FC3F7'];
  for(let i=0;i<52;i++){
    const p=document.createElement('div');p.className='cp';
    p.style.cssText=`left:${Math.random()*100}%;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-delay:${Math.random()*1.5}s;animation-duration:${1.5+Math.random()}s;transform:rotate(${Math.random()*360}deg);width:${6+Math.random()*6}px;height:${6+Math.random()*6}px`;
    w.appendChild(p);
  }
}
function toast(icon,txt,sub){
  document.getElementById('t-icon').textContent=icon;
  document.getElementById('t-txt').textContent=txt;
  document.getElementById('t-sub').textContent=sub||'';
  const el=document.getElementById('toast');el.classList.add('show');
  if(S.toastTimer)clearTimeout(S.toastTimer);
  S.toastTimer=setTimeout(()=>el.classList.remove('show'),3000);
}
/* ── SWIPE NAVIGATION ───────────────────────── */
function initSwipe(){
  const c=document.getElementById('screen-container');
  let sx=0,sy=0,dragging=false;
  c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;dragging=false;},{passive:true});
  c.addEventListener('touchmove',e=>{
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!dragging&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8)dragging=true;
  },{passive:true});
  c.addEventListener('touchend',e=>{
    if(!dragging)return;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>55){
      if(dx<0&&S.screen<4)go(S.screen+1);
      else if(dx>0&&S.screen>0)go(S.screen-1);
    }
    dragging=false;
  },{passive:true});
}
/* ── RENDER DISPATCHER ──────────────────────── */
function renderScreen(idx){
  switch(idx){case 0:renderHome();break;case 1:renderWorkout();break;case 2:renderNutrition();break;case 3:renderProgress();break;case 4:renderSettings();break;}
  const el=document.getElementById('s'+idx);if(el)el.scrollTop=0;
}
/* ── TAB BAR BUILD ──────────────────────────── */
function buildTabs(){
  const tabs=[
    {icon:'home',label:'Home'},
    {icon:'dumbbell',label:'Workout'},
    {icon:'food',label:'Nutrition'},
    {icon:'chart',label:'Progress'},
    {icon:'gear',label:'Settings'},
  ];
  document.getElementById('tab-bar').innerHTML=tabs.map((t,i)=>`
    <button class="tab-btn${i===0?' active':''}" onclick="go(${i})">
      <div class="tab-icon">${svgIcon(t.icon,22,'var(--t3)')}</div>
      <div class="tab-label">${t.label}</div>
    </button>`).join('');
}
/* ── INIT ───────────────────────────────────── */
function init(){
  S.today=todayStr();
  const firstRun=needsOnboard();
  resetIfStale();
  S.cfg=DB.settings();
  S.workout=DB.workout();
  const existing=DB.log(S.today);
  S.log=existing||freshLog(S.today);
  if(!existing)DB.saveLog(S.today,S.log);
  // Merge any missing settings keys
  if(!S.cfg.targets)S.cfg.targets=DEF_SETTINGS.targets;
  if(!S.cfg.body)S.cfg.body=DEF_SETTINGS.body;
  if(!S.cfg.notifications)S.cfg.notifications=DEF_SETTINGS.notifications;
  if(!S.cfg.profile)S.cfg.profile=DEF_SETTINGS.profile;
  if(!S.cfg.units)S.cfg.units=DEF_SETTINGS.units;
  if(!S.cfg.unitHeight)S.cfg.unitHeight=DEF_SETTINGS.unitHeight;
  if(!S.cfg.unitVol)S.cfg.unitVol=DEF_SETTINGS.unitVol;
  if(!S.cfg.theme)S.cfg.theme=DEF_SETTINGS.theme;
  if(S.cfg.proteinPowder==null)S.cfg.proteinPowder=DEF_SETTINGS.proteinPowder;
  if(!S.cfg.programStart)S.cfg.programStart=DEF_SETTINGS.programStart;
  if(S.cfg.gymTarget==null)S.cfg.gymTarget=DEF_SETTINGS.gymTarget;
  ['water','gym','weight','dose'].forEach(k=>{if(!S.cfg.notifications[k])S.cfg.notifications[k]={enabled:true};});
  ['carbs','fat','creatine'].forEach(k=>{if(S.cfg.targets[k]==null)S.cfg.targets[k]=DEF_SETTINGS.targets[k];});
  if(migrateDoseSettings(S.cfg,firstRun))DB.saveSettings(S.cfg);
  applyTheme();
  /* "system" tracks the OS live: this only re-resolves when the pref is
     actually "system", an explicit dark/light choice ignores the OS. */
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{
    if((S.cfg.theme||'system')==='system')applyTheme();
  });
  buildTabs();
  renderScreen(0);
  ingestFromHash();
  window.addEventListener('hashchange',ingestFromHash);
  initSwipe();
  initPush();
  loadFoods();
  loadProgram();
  // Onboarding collects a real weight in a moment. Seeding the placeholder
  // first would put a fictional entry at the head of the chart that every
  // trend and projection then reads as his actual starting point.
  if(firstRun){openOnboard();return;}
  const wh=DB.weights();
  if(wh.length===0)DB.addWeight(S.cfg.programStart||S.today,S.cfg.body.startingWeight);
}
document.addEventListener('DOMContentLoaded',init);
